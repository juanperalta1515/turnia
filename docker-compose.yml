services:
  postgres:
    image: postgres:16-alpine
    container_name: turnia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: turnia_secure_password_2026
      POSTGRES_DB: turnia_db
    ports:
      - "5439:5432" # Changed host port to 5439 to avoid conflict with local host PostgreSQL service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: turnia-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
